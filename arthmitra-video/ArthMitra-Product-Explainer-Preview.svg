  <text x="54" y="316" fill="#f8f6f0" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700">Understand your choices.</text>
  <text x="58" y="379" fill="#d0d8e4" font-family="Arial, Helvetica, sans-serif" font-size="25">Meet the financial safety workspace built around Scam Shield.</text>
