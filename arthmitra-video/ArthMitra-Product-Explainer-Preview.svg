<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title description">
  <title id="title">ArthMitra product explainer</title>
  <desc id="description">A video cover for ArthMitra, a personal finance and financial safety workspace. Click to watch the product explainer.</desc>
  <defs>
