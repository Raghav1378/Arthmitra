      <stop offset="0" stop-color="#10152e"/>
      <stop offset="0.55" stop-color="#182342"/>
      <stop offset="1" stop-color="#102c37"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efbd69"/>
      <stop offset="1" stop-color="#f4d89e"/>
