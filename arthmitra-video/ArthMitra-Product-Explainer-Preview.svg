    <radialGradient id="glow" cx="78%" cy="46%" r="60%">
      <stop offset="0" stop-color="#3f827a" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#3f827a" stop-opacity="0"/>
    </radialGradient>
